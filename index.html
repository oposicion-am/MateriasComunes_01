<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Test Normativa básica (CE, Ley 3/2001, Leyes 39 y 40/2015, Función Pública CyL)</title>
<style>
:root{--verde:#2f6b3a;--verde2:#e8f1e9;--tinta:#1f2a24;--gris:#6b7770;--borde:#d5ddd7;--ok:#1f7a3a;--okbg:#e4f4e8;--ko:#b3261e;--kobg:#fbe9e7;--fondo:#f6f8f6}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--fondo);color:var(--tinta);line-height:1.5}
.wrap{max-width:780px;margin:0 auto;padding:24px 16px 40px}
header h1{font-size:1.25rem;margin:0 0 4px;color:var(--verde)}
header p{margin:0;color:var(--gris);font-size:.92rem}
.prog{display:flex;align-items:center;gap:12px;margin:22px 0 14px;font-size:.88rem;color:var(--gris)}
.bar{flex:1;height:8px;background:#dfe6e1;border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--verde);transition:width .3s}
.card{background:#fff;border:1px solid var(--borde);border-radius:12px;padding:22px}
.qhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:.85rem;color:var(--gris)}
.tag{padding:2px 9px;border-radius:20px;background:var(--verde2);color:var(--verde);font-weight:bold;font-size:.78rem}
.q{font-size:1.06rem;font-weight:bold;margin:0 0 16px;text-align:justify}
.opt{display:flex;gap:10px;width:100%;text-align:left;background:#fff;border:1.5px solid var(--borde);border-radius:9px;padding:11px 13px;margin:0 0 9px;font:inherit;color:inherit;cursor:pointer}
.opt:hover:not(:disabled){border-color:var(--verde);background:#f7fbf8}
.opt b{min-width:20px}
.opt:disabled{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ko{border-color:var(--ko);background:var(--kobg)}
.why{margin-top:14px;padding:12px 14px;border-radius:9px;font-size:.93rem;text-align:justify;display:none}
.why.ok{display:block;background:var(--okbg);border-left:4px solid var(--ok)}
.why.ko{display:block;background:var(--kobg);border-left:4px solid var(--ko)}
.actions{display:flex;justify-content:flex-end;margin-top:16px;gap:10px;flex-wrap:wrap}
.btn{background:var(--verde);color:#fff;border:0;border-radius:8px;padding:10px 18px;font:inherit;font-weight:bold;cursor:pointer}
.btn.sec{background:#fff;color:var(--verde);border:1.5px solid var(--verde)}
.btn:disabled{opacity:.4;cursor:default}
.result{text-align:center}
.big{font-size:3rem;font-weight:bold;color:var(--verde);margin:6px 0}
.result ul{text-align:left;padding-left:18px}
.result li{margin-bottom:8px;text-align:justify}
footer{margin-top:34px;text-align:center;font-size:.8rem;color:var(--gris)}
footer a{color:var(--gris);text-decoration:underline;cursor:pointer}
#lock{display:none;margin-top:12px}
#lock input{padding:8px 10px;border:1px solid var(--borde);border-radius:7px;font:inherit;width:200px}
#lockmsg{color:var(--ko);font-size:.85rem;min-height:1.2em;margin-top:6px}
#word{display:none}
#wordbody{background:#fff;border:1px solid var(--borde);padding:28px 34px;font-family:Arial;font-size:11pt}
@media print{
  body{background:#fff}
  .noprint{display:none!important}
  #wordbody{border:0;padding:0}
}
</style>
</head>
<body>
<div class="wrap">
  <div id="quiz">
    <header class="noprint">
      <h1>TEST DE EVALUACIÓN - Normativa básica: Constitución Española, Ley 3/2001 del Gobierno y la Administración de CyL, Leyes 39/2015 y 40/2015 y Ley de la Función Pública de CyL</h1>
      <p>25 preguntas · una sola respuesta correcta · corrección inmediata</p>
    </header>
    <div class="prog noprint"><span id="cnt">1 / 25</span><div class="bar"><i id="barfill"></i></div><span id="score">0 aciertos</span></div>
    <div class="card" id="stage"></div>
  </div>

  <div id="word">
    <div class="actions noprint" style="justify-content:flex-start;margin-bottom:14px">
      <button class="btn" onclick="copyWord()">Copiar para Word</button>
      <button class="btn" onclick="window.print()">Imprimir / PDF</button>
      <button class="btn" onclick="downloadDoc()">Descargar .doc</button>
      <button class="btn sec" onclick="closeWord()">Volver al test</button>
      <span id="copymsg" style="align-self:center;font-size:.85rem;color:var(--ok)"></span>
    </div>
    <div id="wordbody"></div>
  </div>

  <footer class="noprint" id="foot">
    <a onclick="toggleLock()">Acceso docente</a>
    <div id="lock">
      <input type="password" id="pw" placeholder="Contraseña" onkeydown="if(event.key==='Enter')unlock()">
      <button class="btn" style="padding:8px 14px" onclick="unlock()">Entrar</button>
      <div id="lockmsg"></div>
    </div>
  </footer>
</div>

<script>
const DATA = [{"d": "Fácil", "q": "Según el artículo 45.1 de la Constitución Española, todos tienen el derecho a disfrutar de un medio ambiente adecuado para el desarrollo de la persona, así como:", "o": ["La obligación de denunciar cualquier daño ambiental ante los poderes públicos.", "La facultad de exigir su protección directamente ante el Tribunal Constitucional.", "El deber de restaurarlo cuando resulte dañado por terceros.", "El deber de conservarlo."], "c": 3, "w": "CE, art. 45.1: «Todos tienen el derecho a disfrutar de un medio ambiente adecuado para el desarrollo de la persona, así como el deber de conservarlo». La defensa y restauración del medio ambiente se encomienda a los poderes públicos (art. 45.2)."}, {"d": "Medio", "q": "Conforme al artículo 45.3 de la Constitución, para quienes violen la obligación de utilización racional de los recursos naturales se establecerán, en los términos que la ley fije:", "o": ["Sanciones penales en todo caso, sin perjuicio de la responsabilidad civil derivada del delito.", "Únicamente sanciones administrativas y la obligación de indemnizar a la Administración.", "Sanciones administrativas y, solo cuando no sea posible la reparación, sanciones penales.", "Sanciones penales o, en su caso, administrativas, así como la obligación de reparar el daño causado."], "c": 3, "w": "CE, art. 45.3: se establecerán sanciones penales o, en su caso, administrativas, así como la obligación de reparar el daño causado."}, {"d": "Fácil", "q": "Según el artículo 148.1 de la Constitución, entre las materias en las que las Comunidades Autónomas podrán asumir competencias figuran:", "o": ["Los montes y aprovechamientos forestales.", "Los aprovechamientos hidráulicos cuando las aguas discurran por más de una Comunidad Autónoma.", "La legislación básica sobre montes, aprovechamientos forestales y vías pecuarias.", "La legislación básica sobre protección del medio ambiente."], "c": 0, "w": "CE, art. 148.1.8.ª: «Los montes y aprovechamientos forestales». La legislación básica en materia de medio ambiente, montes y vías pecuarias es competencia exclusiva del Estado (art. 149.1.23.ª)."}, {"d": "Medio", "q": "El artículo 103.1 de la Constitución dispone que la Administración Pública actúa de acuerdo con los principios de:", "o": ["Eficacia, jerarquía, descentralización, desconcentración y coordinación, con sometimiento pleno a la ley y al Derecho.", "Objetividad, imparcialidad, transparencia, desconcentración y participación ciudadana.", "Eficacia, eficiencia, descentralización, cooperación y lealtad institucional.", "Legalidad, jerarquía, publicidad, eficiencia y coordinación, con sometimiento pleno a la Constitución."], "c": 0, "w": "CE, art. 103.1: la Administración sirve con objetividad los intereses generales y actúa de acuerdo con los principios de eficacia, jerarquía, descentralización, desconcentración y coordinación, con sometimiento pleno a la ley y al Derecho."}, {"d": "Alto", "q": "De acuerdo con el artículo 25.3 de la Constitución Española:", "o": ["La Administración civil solo podrá imponer sanciones privativas de libertad cuando así lo prevea una ley orgánica.", "La Administración civil no podrá imponer sanciones que, directa o subsidiariamente, impliquen privación de libertad.", "Las sanciones administrativas podrán implicar privación de libertad subsidiaria en caso de impago de multas.", "La Administración militar y la civil podrán imponer arrestos de hasta treinta días en los casos tasados por ley."], "c": 1, "w": "CE, art. 25.3: «La Administración civil no podrá imponer sanciones que, directa o subsidiariamente, impliquen privación de libertad». Lo reitera la Ley 40/2015, art. 29.1."}, {"d": "Fácil", "q": "Según la Ley 3/2001, del Gobierno y de la Administración de la Comunidad de Castilla y León, la Administración General de la Comunidad se organiza territorialmente en:", "o": ["Comarcas administrativas agrupadas por Servicios Territoriales.", "Delegaciones Territoriales de la Junta de Castilla y León en cada una de las provincias.", "Secretarías Territoriales dependientes directamente de cada Consejería.", "Subdelegaciones de la Junta en cada provincia, dependientes de la Consejería de Presidencia."], "c": 1, "w": "Ley 3/2001, art. 41.1. Las Delegaciones Territoriales son los órganos directivos periféricos (art. 42.1) y se estructuran en una Secretaría Territorial y en los Servicios Territoriales necesarios (art. 42.2)."}, {"d": "Medio", "q": "Conforme al artículo 60.2 de la Ley 3/2001, a efectos del recurso de alzada, ¿qué órgano tiene la consideración de superior respecto de los actos de los Delegados Territoriales?", "o": ["La Junta de Castilla y León.", "El Consejero de la Presidencia, en todo caso.", "Los Secretarios generales y los Directores generales, en virtud de su competencia material.", "El Viceconsejero de la Consejería correspondiente."], "c": 2, "w": "Ley 3/2001, art. 60.2: los Secretarios generales y Directores generales, en virtud de su competencia material, son órgano superior respecto de los actos de los Jefes de Servicio de ellos dependientes en la Administración central y, en la periférica, de los actos de los Delegados Territoriales y Jefes de Departamento Territoriales."}, {"d": "Alto", "q": "Según el artículo 61.1 de la Ley 3/2001, NO pone fin a la vía administrativa:", "o": ["La resolución dictada en un recurso de alzada.", "La resolución de un Consejero, salvo que una ley otorgue expresamente recurso de alzada ante la Junta.", "La resolución de un Director general en materia de concesión de una autorización de aprovechamiento forestal.", "La resolución de un Director general en materia de personal."], "c": 2, "w": "Ley 3/2001, art. 61.1: ponen fin a la vía administrativa, entre otras, las resoluciones de los Consejeros (salvo alzada ante la Junta prevista por ley), las de Viceconsejeros, Secretarios generales y Directores generales en materia de personal y las dictadas en recursos de alzada. Fuera de materia de personal, las resoluciones de un Director general son recurribles en alzada ante el Consejero (art. 60.2)."}, {"d": "Medio", "q": "De acuerdo con el artículo 70 de la Ley 3/2001, las resoluciones administrativas de la Junta de Castilla y León y las de su Presidente adoptarán la forma de:", "o": ["Resolución.", "Acuerdo.", "Decreto.", "Orden."], "c": 1, "w": "Ley 3/2001, art. 70: adoptan la forma de Decreto las disposiciones de carácter general de la Junta y de su Presidente (art. 70.1), y la forma de Acuerdo sus resoluciones administrativas (art. 70.2). Las de los Consejeros son Órdenes (art. 71) y las de órganos inferiores, Resoluciones (art. 72)."}, {"d": "Fácil", "q": "Según el artículo 74 de la Ley 3/2001, las disposiciones administrativas de carácter general de la Junta entrarán en vigor, salvo que en ellas se disponga otra cosa:", "o": ["Al día siguiente de su publicación en el «Boletín Oficial de Castilla y León».", "A los veinte días de su publicación en el «Boletín Oficial de Castilla y León».", "A los quince días de su publicación en el «Boletín Oficial del Estado».", "Al mes de su publicación en el «Boletín Oficial de Castilla y León»."], "c": 1, "w": "Ley 3/2001, art. 74: se publican en el BOCYL y entran en vigor a los veinte días de su publicación, salvo que en las mismas se dispusiere otra cosa."}, {"d": "Fácil", "q": "Según el artículo 21.3 de la Ley 39/2015, cuando las normas reguladoras de un procedimiento no fijen el plazo máximo para resolver y notificar, este será de:", "o": ["Dos meses.", "Un mes.", "Tres meses.", "Seis meses."], "c": 2, "w": "Ley 39/2015, art. 21.3: a falta de plazo en la norma reguladora, el plazo máximo será de tres meses, contado desde el acuerdo de iniciación (procedimientos de oficio) o desde la entrada de la solicitud en el registro electrónico (a solicitud del interesado)."}, {"d": "Medio", "q": "Conforme al artículo 43.2 de la Ley 39/2015, cuando la notificación por medios electrónicos sea obligatoria o haya sido expresamente elegida por el interesado, se entenderá rechazada cuando hayan transcurrido sin acceder a su contenido:", "o": ["Diez días naturales desde su puesta a disposición.", "Quince días naturales desde el envío del aviso de notificación.", "Diez días hábiles desde su puesta a disposición.", "Cinco días hábiles desde su puesta a disposición."], "c": 0, "w": "Ley 39/2015, art. 43.2: se entenderá rechazada cuando hayan transcurrido diez días naturales desde la puesta a disposición de la notificación sin que se acceda a su contenido."}, {"d": "Medio", "q": "Según el artículo 68 de la Ley 39/2015, si una solicitud de iniciación no reúne los requisitos exigidos, se requerirá al interesado para que la subsane en un plazo de:", "o": ["Diez días, ampliable hasta cinco días más salvo en procedimientos selectivos o de concurrencia competitiva.", "Quince días, improrrogable.", "Cinco días, ampliable hasta cinco días más a petición del interesado.", "Diez días, ampliable hasta diez días más en todo tipo de procedimientos."], "c": 0, "w": "Ley 39/2015, art. 68.1 y 2: plazo de diez días, con advertencia de tenerle por desistido; puede ampliarse prudencialmente hasta cinco días, salvo en procedimientos selectivos o de concurrencia competitiva."}, {"d": "Alto", "q": "De acuerdo con los artículos 122 y 124 de la Ley 39/2015, contra un acto expreso, el plazo máximo para dictar y notificar la resolución es:", "o": ["De un mes en el recurso de alzada y de tres meses en el recurso de reposición.", "De un mes tanto en el recurso de alzada como en el de reposición.", "De tres meses en el recurso de alzada y de un mes en el recurso de reposición.", "De tres meses tanto en el recurso de alzada como en el de reposición."], "c": 2, "w": "Ley 39/2015: ambos recursos se interponen en el plazo de un mes si el acto es expreso; la alzada debe resolverse en tres meses (art. 122.2) y la reposición en un mes (art. 124.2)."}, {"d": "Medio", "q": "Según el artículo 67.1 de la Ley 39/2015, en los procedimientos de responsabilidad patrimonial, el derecho a reclamar prescribe:", "o": ["A los dos años de producido el hecho, salvo daños físicos, que prescriben a los cuatro años.", "A los seis meses desde que el interesado tuvo conocimiento del daño.", "Al año desde la producción del hecho, sin que quepa otro momento de inicio del cómputo.", "Al año de producido el hecho o el acto que motive la indemnización o de manifestarse su efecto lesivo."], "c": 3, "w": "Ley 39/2015, art. 67.1: prescribe al año de producido el hecho o acto o de manifestarse su efecto lesivo; en daños físicos o psíquicos el plazo empieza a computarse desde la curación o la determinación del alcance de las secuelas."}, {"d": "Medio", "q": "Según el artículo 9.2 de la Ley 40/2015, NO podrán ser objeto de delegación las competencias relativas a:", "o": ["La concesión de autorizaciones y licencias.", "La resolución de procedimientos sancionadores.", "La firma de resoluciones en materia de personal.", "La adopción de disposiciones de carácter general."], "c": 3, "w": "Ley 40/2015, art. 9.2: no son delegables los asuntos relativos a relaciones con la Jefatura del Estado, Presidencia del Gobierno, Cortes, Presidencias de Consejos de Gobierno autonómicos y Asambleas Legislativas; la adopción de disposiciones de carácter general; la resolución de recursos en los órganos que dictaron los actos recurridos; y las materias que determine una norma con rango de Ley."}, {"d": "Fácil", "q": "Conforme al artículo 11.2 de la Ley 40/2015, la encomienda de gestión:", "o": ["Supone la transferencia de la titularidad de la competencia al órgano encomendado.", "Permite al órgano encomendado dictar los actos jurídicos que den soporte a la actividad material encomendada.", "Solo puede realizarse entre órganos de la misma Administración.", "No supone cesión de la titularidad de la competencia ni de los elementos sustantivos de su ejercicio."], "c": 3, "w": "Ley 40/2015, art. 11: la encomienda tiene por objeto actividades de carácter material o técnico, puede hacerse a órganos o entidades de la misma o de distinta Administración y no supone cesión de la titularidad de la competencia; los actos jurídicos los sigue dictando el órgano encomendante."}, {"d": "Alto", "q": "Según el artículo 23.2 de la Ley 40/2015, es motivo de abstención el parentesco con cualquiera de los interesados:", "o": ["De consanguinidad o afinidad dentro del tercer grado.", "De consanguinidad dentro del cuarto grado o de afinidad dentro del segundo.", "De consanguinidad dentro del cuarto grado o de afinidad dentro del tercero.", "De consanguinidad dentro del segundo grado o de afinidad dentro del cuarto."], "c": 1, "w": "Ley 40/2015, art. 23.2.b): vínculo matrimonial o situación de hecho asimilable y parentesco de consanguinidad dentro del cuarto grado o de afinidad dentro del segundo. Si el recusado niega la causa, el superior resuelve en tres días (art. 24.4)."}, {"d": "Medio", "q": "De acuerdo con el artículo 17.2 de la Ley 40/2015, para la válida constitución de un órgano colegiado se requiere la asistencia, presencial o a distancia:", "o": ["Del Presidente y del Secretario, o de quienes les suplan, y de la mitad, al menos, de sus miembros.", "Del Presidente, del Secretario y de un tercio de sus miembros en primera convocatoria.", "De la mayoría absoluta de sus miembros, incluido el Presidente.", "Del Presidente y de dos tercios de sus miembros, sin que sea necesaria la presencia del Secretario."], "c": 0, "w": "Ley 40/2015, art. 17.2: asistencia del Presidente y Secretario o de quienes les suplan, y la de la mitad, al menos, de sus miembros. Las sesiones pueden celebrarse de forma presencial o a distancia (art. 17.1)."}, {"d": "Alto", "q": "Según el artículo 30.1 de la Ley 40/2015, si la ley que establece las infracciones no fija plazos de prescripción, las infracciones graves prescribirán a los dos años y las leves:", "o": ["A los seis meses; y las sanciones impuestas por faltas leves, al año.", "A los seis meses; y las sanciones impuestas por faltas leves, también a los seis meses.", "A los tres meses; y las sanciones impuestas por faltas leves, al año.", "Al año; y las sanciones impuestas por faltas leves, a los seis meses."], "c": 0, "w": "Ley 40/2015, art. 30.1: infracciones muy graves, 3 años; graves, 2 años; leves, 6 meses. Sanciones por faltas muy graves, 3 años; graves, 2 años; leves, 1 año."}, {"d": "Fácil", "q": "Según el artículo 32.4 de la Ley de la Función Pública de Castilla y León, la Escala de Agentes Medioambientales existe dentro del:", "o": ["Cuerpo de Técnicos y Diplomados Especialistas, Grupo B, Administración Especial.", "Cuerpo de Gestión, Grupo B, Administración General.", "Cuerpo de Ayudantes Facultativos, Grupo C, Administración Especial.", "Cuerpo de Auxiliares Facultativos, Grupo D, Administración Especial."], "c": 2, "w": "Ley de Función Pública de CyL, art. 32.4: «En el Grupo C, Administración Especial, existirá el Cuerpo de Ayudantes Facultativos en sus distintas especialidades. En este Cuerpo existirá la Escala de Agentes Medioambientales». La disposición adicional vigesimoprimera, que creaba un Cuerpo de Agentes Medioambientales del Grupo B, figura en el texto consolidado como «sin efecto»."}, {"d": "Fácil", "q": "Conforme al artículo 58 de la Ley de la Función Pública de Castilla y León, los funcionarios tienen derecho a disfrutar, por cada año natural de servicio activo, de unas vacaciones retribuidas de:", "o": ["Veintidós días hábiles, o los que correspondan proporcionalmente si el tiempo de servicio fuera menor.", "Veinticinco días hábiles, más un día adicional por cada cinco años de servicio.", "Treinta días naturales, en todo caso.", "Un mes natural, o los días que correspondan proporcionalmente."], "c": 0, "w": "Ley de Función Pública de CyL, art. 58.1: veintidós días hábiles; además, un día hábil adicional al cumplir quince años de servicio y otro más al cumplir veinte, veinticinco y treinta años."}, {"d": "Medio", "q": "Según el artículo 85 de la Ley de la Función Pública de Castilla y León, la sanción de separación del servicio:", "o": ["Solo podrá imponerse por faltas muy graves, por resolución del Secretario General de la Consejería de destino.", "Podrá imponerse por faltas muy graves por acuerdo del Consejo de la Función Pública.", "Solo podrá imponerse por faltas muy graves, por acuerdo de la Junta de Castilla y León a propuesta del Consejero competente.", "Podrá imponerse por faltas graves o muy graves, por resolución del Consejero competente en materia de Función Pública."], "c": 2, "w": "Ley de Función Pública de CyL, art. 85.2. La suspensión de funciones y el traslado a puesto de distinta localidad pueden imponerse por faltas graves o muy graves, y las faltas leves solo con apercibimiento (art. 85.3)."}, {"d": "Alto", "q": "De acuerdo con el artículo 87 de la Ley de la Función Pública de Castilla y León, las faltas disciplinarias prescriben:", "o": ["Las muy graves a los tres años, las graves a los dos y las leves a los seis meses.", "Las muy graves a los seis años, las graves a los dos y las leves a los dos meses.", "Las muy graves a los cuatro años, las graves a los dos y las leves al mes.", "Las muy graves a los seis años, las graves a los tres y las leves al año."], "c": 1, "w": "Ley de Función Pública de CyL, art. 87: faltas muy graves, 6 años; graves, 2 años; leves, 2 meses (mismos plazos para las sanciones). Hay que distinguirlo de los plazos generales del art. 30 de la Ley 40/2015 (3 años, 2 años, 6 meses). El procedimiento disciplinario debe resolverse y notificarse en doce meses (art. 86.4)."}, {"d": "Medio", "q": "Según el artículo 91.2 de la Ley de la Función Pública de Castilla y León, para solicitar la excedencia voluntaria por interés particular es preciso:", "o": ["Haber prestado servicios efectivos en la Administración de Castilla y León durante diez años, con una permanencia mínima de dos años.", "Haber prestado servicios efectivos durante los tres años inmediatamente anteriores, con una permanencia mínima de un año.", "Haber prestado servicios efectivos durante los cinco años anteriores, con una permanencia máxima de quince años.", "Haber prestado servicios efectivos en cualquier Administración Pública durante los cinco años inmediatamente anteriores, sin que pueda permanecerse en ella menos de dos años continuados."], "c": 3, "w": "Ley de Función Pública de CyL, art. 91.2. La excedencia por agrupación familiar tiene una duración mínima de dos años y máxima de quince (art. 91.3)."}];

const L = "abcd";
let i = 0, hits = 0, answered = false, fails = [];

function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

function render(){
  const it = DATA[i];
  answered = false;
  document.getElementById("cnt").textContent = (i+1)+" / "+DATA.length;
  document.getElementById("barfill").style.width = (i/DATA.length*100)+"%";
  document.getElementById("score").textContent = hits+(hits===1?" acierto":" aciertos");
  let h = '<div class="qhead"><span>Pregunta '+(i+1)+'</span><span class="tag">'+it.d+'</span></div>';
  h += '<p class="q">'+esc(it.q)+'</p>';
  it.o.forEach((o,k)=>{ h += '<button class="opt" data-k="'+k+'" onclick="pick('+k+')"><b>'+L[k]+')</b><span>'+esc(o)+'</span></button>'; });
  h += '<div class="why" id="why"></div>';
  h += '<div class="actions"><button class="btn" id="next" disabled onclick="next()">'+(i<DATA.length-1?"Siguiente":"Ver resultado")+'</button></div>';
  document.getElementById("stage").innerHTML = h;
}

function pick(k){
  if(answered) return; answered = true;
  const it = DATA[i], btns = document.querySelectorAll(".opt");
  btns.forEach(b=>b.disabled=true);
  btns[it.c].classList.add("ok");
  const why = document.getElementById("why");
  if(k===it.c){ hits++; why.className="why ok"; why.innerHTML="<b>Correcto.</b> "+esc(it.w); }
  else { btns[k].classList.add("ko"); fails.push(i); why.className="why ko"; why.innerHTML="<b>Incorrecto. La respuesta correcta es la "+L[it.c]+").</b> "+esc(it.w); }
  document.getElementById("score").textContent = hits+(hits===1?" acierto":" aciertos");
  document.getElementById("next").disabled = false;
}

function next(){ if(i<DATA.length-1){ i++; render(); } else finish(); }

function finish(){
  document.getElementById("barfill").style.width = "100%";
  const nota = (hits/DATA.length*10).toFixed(2).replace(".",",");
  const msg = hits>=Math.ceil(DATA.length*0.85) ? "Excelente. Dominas el tema." : hits>=Math.ceil(DATA.length*0.5) ? "Aprobado. Repasa las preguntas falladas." : "Necesitas repasar el tema.";
  let h = '<div class="result"><p style="margin:0;color:var(--gris)">Resultado</p><div class="big">'+nota+'</div>';
  h += '<p><b>'+hits+'</b> aciertos de '+DATA.length+'. '+msg+'</p></div>';
  if(fails.length){
    h += '<div class="result"><p style="text-align:left;font-weight:bold;margin-top:18px">Preguntas falladas</p><ul>';
    fails.forEach(f=>{ const it=DATA[f]; h += '<li><b>'+(f+1)+'.</b> '+esc(it.q)+'<br><span style="color:var(--ok)">Correcta: '+L[it.c]+') '+esc(it.o[it.c])+'</span></li>'; });
    h += '</ul></div>';
  }
  h += '<div class="actions" style="justify-content:center"><button class="btn" onclick="restart()">Repetir el test</button></div>';
  document.getElementById("stage").innerHTML = h;
}

function restart(){ i=0; hits=0; fails=[]; render(); }

/* ---- Acceso docente ---- */
function toggleLock(){ const l=document.getElementById("lock"); l.style.display = l.style.display==="block"?"none":"block"; if(l.style.display==="block") document.getElementById("pw").focus(); }
function b64(s){ return Uint8Array.from(atob(s), c=>c.charCodeAt(0)); }
async function unlock(){
  const msg = document.getElementById("lockmsg"); msg.textContent = "";
  try{
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(document.getElementById("pw").value), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(ENC.s), iterations:250000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
    const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(ENC.i)}, key, b64(ENC.c));
    document.getElementById("wordbody").innerHTML = new TextDecoder().decode(plain);
    document.getElementById("pw").value = "";
    document.getElementById("lock").style.display = "none";
    document.getElementById("quiz").style.display = "none";
    document.getElementById("foot").style.display = "none";
    document.getElementById("word").style.display = "block";
    window.scrollTo(0,0);
  }catch(e){ msg.textContent = "Contraseña incorrecta."; }
}
function closeWord(){
  document.getElementById("wordbody").innerHTML = "";
  document.getElementById("word").style.display = "none";
  document.getElementById("quiz").style.display = "block";
  document.getElementById("foot").style.display = "block";
}
async function copyWord(){
  const body = document.getElementById("wordbody"), m = document.getElementById("copymsg");
  try{
    await navigator.clipboard.write([new ClipboardItem({"text/html":new Blob([body.innerHTML],{type:"text/html"}),"text/plain":new Blob([body.innerText],{type:"text/plain"})})]);
    m.textContent = "Copiado. Pégalo en Word.";
  }catch(e){
    const r = document.createRange(); r.selectNodeContents(body); const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    try{ document.execCommand("copy"); m.textContent = "Copiado. Pégalo en Word."; }catch(e2){ m.textContent = "Selecciona el texto y copia con Ctrl+C."; }
    s.removeAllRanges();
  }
}
function downloadDoc(){
  const doc = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><style>body{font-family:Arial;font-size:11pt}</style></head><body>'+document.getElementById("wordbody").innerHTML+'</body></html>';
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿",doc],{type:"application/msword"}));
  a.download = "Test_Normativa_basica.doc"; document.body.appendChild(a); a.click(); a.remove();
}
render();
